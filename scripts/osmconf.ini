# GDAL OSM driver configuration for scripts/pbf.ts: report every tag as JSON in `all_tags`, and expose the keys
# used to pick features as plain fields so ogr2ogr can filter on them.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform
tags_format=json

[points]
osm_id=yes
attributes=name,tourism,historic,heritage,leisure,natural,waterway,boundary,amenity,craft,shop,railway,route,man_made
all_tags=yes

[lines]
osm_id=yes
attributes=name,tourism,historic,heritage,leisure,natural,waterway,boundary,amenity,craft,shop,railway,route,man_made
all_tags=yes

[multipolygons]
# For multipolygons osm_id is the relation id and osm_way_id the id of a closed way; only one is set.
osm_id=yes
attributes=name,tourism,historic,heritage,leisure,natural,waterway,boundary,amenity,craft,shop,railway,route,man_made
all_tags=yes

[multilinestrings]
osm_id=yes
attributes=name,tourism,historic,heritage,leisure,natural,waterway,boundary,amenity,craft,shop,railway,route,man_made
all_tags=yes
